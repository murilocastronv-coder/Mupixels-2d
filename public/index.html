<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Lorencia Pixel MMORPG</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17251b;color:#f8e9c5;font-family:system-ui}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.top{position:absolute;top:0;left:0;right:0;padding:12px 16px;background:linear-gradient(#101610e8,transparent);display:flex;justify-content:space-between;pointer-events:none}.top b{letter-spacing:2px}.top small{display:block;font-size:9px;letter-spacing:1px}.panel{position:absolute;top:76px;left:12px;width:200px;padding:10px;background:#111b17e8;border:1px solid #bca06688;border-radius:7px}.panel label{font-size:10px;letter-spacing:1px;color:#e4c57d}.panel select,.panel button{width:100%;margin-top:7px;padding:9px;background:#29352b;color:#fff0ce;border:1px solid #8e784d;border-radius:4px}.panel p,.panel small{font-size:10px;line-height:1.4}.panel p{color:#d5d4bd}.footer{position:absolute;bottom:8px;width:100%;text-align:center;font-size:8px;letter-spacing:1px;text-shadow:0 1px 4px #000}.joy{position:absolute;bottom:30px;left:16px;width:116px;height:116px;border:2px solid #e7ce8c88;background:#152019a8;border-radius:50%;display:none;touch-action:none}.stick{position:absolute;left:33px;top:33px;width:46px;height:46px;border-radius:50%;background:#bba06aaa;border:2px solid #f5dfac}.actions{position:absolute;right:15px;bottom:32px;display:none;gap:8px}.actions button{width:55px;height:55px;border-radius:50%;background:#342c20e8;color:#ffebbd;border:2px solid #e3c783;font-size:19px}@media(max-width:650px){.joy,.actions{display:flex}.panel{width:165px;top:68px;padding:8px}.panel p,.panel small{font-size:9px}.top{padding:9px}.top b{font-size:12px}.footer{bottom:155px}}@media(orientation:landscape) and (max-height:450px){.panel{top:55px;width:155px}.joy{width:90px;height:90px}.stick{left:24px;top:24px;width:38px;height:38px}}
</style></head><body>
<canvas id="world"></canvas><header class="top"><div><b>✦ LORENCIA</b><small>REINO DOS HERÓIS • PIXEL MMORPG</small></div><div id="coords">138, 127</div></header>
<section class="panel"><label>EXPLORAR LORENCIA</label><select id="zone"><option value="town">Praça central</option><option value="river">Arredores, rio e ponte</option></select><p id="desc">Explore a praça medieval, as casas, a fonte e os guardas.</p><small>PC: WASD/setas • Celular: joystick • Arraste para mover a câmera • Zoom com roda/pinça</small><button id="reset">Centralizar câmera</button></section>
<div class="joy" id="joy"><div class="stick" id="stick"></div></div><div class="actions"><button id="attack">⚔</button><button id="skill">✦</button></div><div class="footer">LORENCIA • CENÁRIO ANIMADO • PROTÓTIPO JOGÁVEL</div>
<script>
(()=>{const canvas=document.getElementById('world'),c=canvas.getContext('2d');let W,H,D=1,t=0,zone='town',zoom=.9,camX=0,camY=0,drag=false,lastX=0,lastY=0,joyX=0,joyY=0,joyOn=false,attack=0,spell=0,pinch=0;const keys={},hero={x:0,y:1,walk:0};function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*D;canvas.height=H*D;c.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();const iso=(x,y,z=0)=>[W/2+camX+(x-y)*20*zoom,H*.5+camY+(x+y)*10*zoom-z*18*zoom];function poly(a,col,edge){c.beginPath();a.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();c.fillStyle=col;c.fill();if(edge){c.strokeStyle=edge;c.lineWidth=Math.max(.5,zoom);c.stroke()}}function dia(x,y,w,h,col,edge){poly([[x,y-h],[x+w,y],[x,y+h],[x-w,y]],col,edge)}function tile(x,y,col){let p=iso(x,y);dia(p[0],p[1],20*zoom,10*zoom,col,'#3e5037');if((x*3+y*5)%8===0){c.fillStyle='#c8b88788';c.fillRect(p[0]-4*zoom,p[1],3*zoom,1.5*zoom)}}function path(x,y){let p=iso(x,y);dia(p[0],p[1],19*zoom,9.5*zoom,(x+y)%3===0?'#b09a70':'#92805f','#514735');for(let i=0;i<3;i++){c.fillStyle=['#c5b184','#71664f','#a8936c'][(x*2+y+i+50)%3];c.fillRect(p[0]+Math.sin(x*9+i)*10*zoom,p[1]+Math.cos(y*4+i)*4*zoom,3*zoom,1.5*zoom)}}function block(x,y,w,d,h,front,side,top){let p=iso(x,y),a=w*zoom,b=d*zoom,z=h*zoom;poly([[p[0],p[1]-z],[p[0]+a,p[1]-z+b/2],[p[0]+a,p[1]+b/2],[p[0],p[1]]],front,'#30291f');poly([[p[0],p[1]-z],[p[0]-a,p[1]-z+b/2],[p[0]-a,p[1]+b/2],[p[0],p[1]]],side,'#30291f');poly([[p[0],p[1]-z],[p[0]+a,p[1]-z+b/2],[p[0],p[1]-z+b],[p[0]-a,p[1]-z+b/2]],top,'#463c2e')}function house(x,y,i){block(x,y,20,19,26,'#8a704e','#574735','#b7a07a');let p=iso(x,y);poly([[p[0]-24*zoom,p[1]-25*zoom],[p[0],p[1]-46*zoom],[p[0]+24*zoom,p[1]-25*zoom],[p[0],p[1]-7*zoom]],i%2?'#67342a':'#493a31','#2d211c');for(let k=-2;k<=2;k++){c.strokeStyle=i%2?'#a9563e':'#81776a';c.lineWidth=1.2*zoom;c.beginPath();c.moveTo(p[0]+k*7*zoom,p[1]-27*zoom);c.lineTo(p[0]+k*3.5*zoom,p[1]-43*zoom);c.stroke()}c.fillStyle='#292019';c.fillRect(p[0]-4*zoom,p[1]-18*zoom,8*zoom,18*zoom);c.fillStyle='#efb95e';c.fillRect(p[0]+8*zoom,p[1]-18*zoom,5*zoom,6*zoom);if(i%3===0){c.fillStyle='#aa8b5b';c.fillRect(p[0]-14*zoom,p[1]-21*zoom,5*zoom,8*zoom)}}function tree(x,y,s=1){block(x,y,3,3,11*s,'#624329','#442f20','#91653b');let p=iso(x,y,14*s);for(let k=0;k<3;k++){let yy=p[1]+k*9*s*zoom;poly([[p[0],yy-18*s*zoom],[p[0]+14*s*zoom,yy],[p[0],yy+10*s*zoom],[p[0]-14*s*zoom,yy]],['#285a36','#387244','#4d8545'][k],'#24452c');poly([[p[0],yy-18*s*zoom],[p[0]+14*s*zoom,yy],[p[0],yy+10*s*zoom]],'#8bb05c33')}}function banner(x,y){let p=iso(x,y,18);c.strokeStyle='#493725';c.lineWidth=2*zoom;c.beginPath();c.moveTo(p[0],p[1]-18*zoom);c.lineTo(p[0],p[1]+13*zoom);c.stroke();poly([[p[0],p[1]-17*zoom],[p[0]+12*zoom,p[1]-14*zoom],[p[0]+11*zoom,p[1]-2*zoom],[p[0],p[1]-5*zoom]],'#153f73','#d2b467');c.fillStyle='#f2d17d';c.font=(8*zoom)+'px serif';c.fillText('✦',p[0]+2*zoom,p[1]-7*zoom)}function torch(x,y){let p=iso(x,y,10),f=Math.sin(t*10+x)*2+Math.cos(t*13+y);c.fillStyle='#4b3725';c.fillRect(p[0]-2*zoom,p[1]-zoom,4*zoom,10*zoom);let g=c.createRadialGradient(p[0],p[1]-7*zoom,1,p[0],p[1]-7*zoom,19*zoom);g.addColorStop(0,'#fff3a8cc');g.addColorStop(.3,'#ff982b99');g.addColorStop(1,'#ff600000');c.fillStyle=g;c.beginPath();c.arc(p[0],p[1]-7*zoom,19*zoom,0,7);c.fill();poly([[p[0],p[1]-(8+f)*zoom],[p[0]+4*zoom,p[1]-4*zoom],[p[0],p[1]-zoom],[p[0]-3*zoom,p[1]-4*zoom]],'#ff9228');poly([[p[0],p[1]-(6+f)*zoom],[p[0]+2*zoom,p[1]-3*zoom],[p[0],p[1]-2*zoom],[p[0]-1.5*zoom,p[1]-3*zoom]],'#fff0a1')}function water(x,y){let p=iso(x,y);dia(p[0],p[1],20*zoom,10*zoom,'#126b76','#255a58');for(let i=0;i<3;i++){let f=(t*15+i*13+x*2+y*5)%34;c.strokeStyle='rgba(135,239,224,.65)';c.lineWidth=1.2*zoom;c.beginPath();c.moveTo(p[0]-12*zoom+f*.35,p[1]-2*zoom);c.lineTo(p[0]-4*zoom+f*.35,p[1]-4*zoom);c.stroke()}}function fountain(x,y){let p=iso(x,y);dia(p[0],p[1],28*zoom,14*zoom,'#827d65','#403e32');dia(p[0],p[1]-4*zoom,21*zoom,10*zoom,'#27878a','#b8b9a0');block(x,y,4,4,20,'#9e9274','#6b6350','#c4b99a');let q=iso(x,y,25+Math.sin(t*4)*2);c.fillStyle='#d3f8ff';c.beginPath();c.arc(q[0],q[1],2.5*zoom,0,7);c.fill();for(let i=0;i<8;i++){let a=t*2+i*Math.PI/4;c.fillStyle='#9ce9ef';c.fillRect(p[0]+Math.cos(a)*15*zoom,p[1]-14*zoom+Math.sin(a)*5*zoom,2*zoom,3*zoom)}}const npcs=[];for(let i=0;i<18;i++)npcs.push({x:Math.sin(i*13.7)*10,y:Math.cos(i*8.3)*8,col:['#385c87','#57564c','#8c4933','#555f78'][i%4],phase:i*.8});function npc(o){let p=iso(o.x+Math.sin(t*.7+o.phase)*.12,o.y),bob=Math.sin(t*3+o.phase)*1.4*zoom;c.fillStyle='#0005';c.beginPath();c.ellipse(p[0],p[1],6*zoom,3*zoom,0,0,7);c.fill();block(o.x,o.y,4,3,11,o.col,'#33342d',o.col);let h=iso(o.x,o.y,13);c.fillStyle='#d5a77a';c.fillRect(h[0]-3*zoom,h[1]-4*zoom+bob,6*zoom,7*zoom);c.fillStyle='#302a21';c.fillRect(h[0]-4*zoom,h[1]-5*zoom+bob,8*zoom,3*zoom);if(o.phase%2<1){c.strokeStyle='#c6c9bd';c.lineWidth=2*zoom;c.beginPath();c.moveTo(p[0]+5*zoom,p[1]-8*zoom);c.lineTo(p[0]+10*zoom,p[1]-17*zoom);c.stroke()}}function scene(){for(let y=-23;y<24;y++)for(let x=-26;x<27;x++){if(zone==='river'&&x+y< -10&&x+y> -34){water(x,y);continue}tile(x,y,((x*13+y*5)%9===0)?'#667d4a':((x+y)%4===0?'#748754':'#657b4a'))}if(zone==='town'){for(let y=-15;y<=15;y++)for(let x=-18;x<=18;x++)if(Math.abs(x)<3||Math.abs(y)<3)path(x,y);for(let i=0;i<30;i++){let x=(i%6-3)*5.6+(i%2),y=(Math.floor(i/6)-2)*6.2;if(Math.abs(x)<5&&Math.abs(y)<5)continue;house(x,y,i)}fountain(0,0);[[-5,-4],[5,4],[-2,-7],[3,-2],[-11,5],[11,-1],[0,8]].forEach(a=>torch(...a));[[-13,-8],[13,7],[-15,8],[15,-8],[-8,12],[9,12]].forEach(a=>tree(a[0],a[1],1.1));[[-7,-4],[7,4],[-3,6],[9,-4],[-10,3],[4,-9]].forEach(a=>banner(...a));npcs.forEach(npc)}else{for(let x=-21;x<=21;x++)for(let y=-21;y<=21;y++)if(Math.abs(x-y)<2)path(x,y);[[-15,-8],[-12,-3],[-9,8],[14,-8],[12,2],[8,13],[-16,12],[18,8]].forEach(a=>tree(a[0],a[1],1.2));[[-8,-7],[9,-8],[13,7],[-12,5]].forEach((a,i)=>house(a[0],a[1],i));for(let i=0;i<8;i++){let p=iso(-3+i*.85,2-i*.85);dia(p[0],p[1],9*zoom,4.5*zoom,'#79583b','#382b22')}[[-5,0],[2,-3],[6,4],[-8,7],[9,1]].forEach(a=>torch(...a));npcs.slice(0,12).forEach(npc);for(let i=0;i<16;i++){let x=W*.12+i*2.5*zoom,y=H*.35+((t*35+i*13)%50);c.fillStyle='rgba(174,246,235,.45)';c.fillRect(x,y,2*zoom,8*zoom)}}}function drawHero(){let p=iso(hero.x,hero.y),bob=Math.sin(hero.walk*10)*1.8*zoom;c.fillStyle='#0007';c.beginPath();c.ellipse(p[0],p[1]+2*zoom,7*zoom,3*zoom,0,0,7);c.fill();block(hero.x,hero.y,4.2,3.4,12,'#315b91','#203e68','#4b7eb1');let h=iso(hero.x,hero.y,14);c.fillStyle='#e0b68b';c.fillRect(h[0]-3.5*zoom,h[1]-4*zoom+bob,7*zoom,7*zoom);c.fillStyle='#3c2c21';c.fillRect(h[0]-4*zoom,h[1]-5*zoom+bob,8*zoom,3*zoom);c.strokeStyle='#c5d2d7';c.lineWidth=2*zoom;c.beginPath();c.moveTo(p[0]+4*zoom,p[1]-9*zoom);c.lineTo(p[0]+8*zoom,p[1]-18*zoom);c.stroke();if(attack>0){c.strokeStyle='#f4f4ff';c.lineWidth=3*zoom;c.beginPath();c.arc(p[0],p[1]-8*zoom,(18-attack*6)*zoom,-1.2,1.2);c.stroke();attack=Math.max(0,attack-.07)}if(spell>0){c.strokeStyle='rgba(100,220,255,'+spell+')';c.lineWidth=3*zoom;c.beginPath();c.arc(p[0],p[1]-8*zoom,24*zoom,0,Math.PI*2);c.stroke();spell=Math.max(0,spell-.025)}}function frame(){t+=1/60;c.clearRect(0,0,W,H);c.fillStyle=zone==='town'?'#263b2a':'#123d40';c.fillRect(0,0,W,H);scene();drawHero();for(let i=0;i<16;i++){let x=(i*113+Math.sin(t+i)*15+W*.1)%W,y=(i*59+Math.cos(t*1.3+i)*13+H*.2)%H;c.fillStyle='rgba(255,218,126,'+(.2+.5*Math.abs(Math.sin(t*2+i)))+')';c.fillRect(x,y,2*zoom,2*zoom)}let g=c.createRadialGradient(W*.5,H*.48,Math.min(W,H)*.1,W*.5,H*.5,Math.max(W,H)*.75);g.addColorStop(0,'#0000');g.addColorStop(1,'#080c0877');c.fillStyle=g;c.fillRect(0,0,W,H);document.getElementById('coords').textContent=Math.round(hero.x+138)+', '+Math.round(hero.y+127);requestAnimationFrame(frame)}function move(dx,dy){let l=Math.hypot(dx,dy)||1;hero.x=Math.max(-20,Math.min(20,hero.x+dx/l*.12));hero.y=Math.max(-18,Math.min(18,hero.y+dy/l*.12));if(dx||dy)hero.walk+=.13}function tick(){let dx=0,dy=0;if(keys.w||keys.arrowup)dy--;if(keys.s||keys.arrowdown)dy++;if(keys.a||keys.arrowleft)dx--;if(keys.d||keys.arrowright)dx++;dx+=joyX;dy+=joyY;if(dx||dy)move(dx,dy);requestAnimationFrame(tick)}addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.startsWith('Arrow'))e.preventDefault()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);canvas.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(drag){camX+=e.clientX-lastX;camY+=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY}});canvas.addEventListener('pointerup',()=>drag=false);canvas.addEventListener('pointercancel',()=>drag=false);canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.45,Math.min(1.5,zoom-e.deltaY*.001))},{passive:false});let lastPinch=0;canvas.addEventListener('touchmove',e=>{if(e.touches.length===2){let d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(lastPinch)zoom=Math.max(.45,Math.min(1.5,zoom+(d-lastPinch)*.003));lastPinch=d}},{passive:true});canvas.addEventListener('touchend',()=>lastPinch=0);document.getElementById('zone').onchange=e=>{zone=e.target.value;document.getElementById('desc').textContent=zone==='town'?'Explore a praça medieval, as casas, a fonte e os guardas.':'Explore as trilhas, árvores, rio brilhante e ponte de madeira.';hero.x=hero.y=0;camX=camY=0};document.getElementById('reset').onclick=()=>{camX=camY=0;zoom=.9};document.getElementById('attack').onclick=()=>attack=1;document.getElementById('skill').onclick=()=>spell=1;const joy=document.getElementById('joy'),stick=document.getElementById('stick');function setJoy(e){let r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),lim=r.width*.34,l=Math.hypot(dx,dy)||1;if(l>lim){dx=dx/l*lim;dy=dy/l*lim}stick.style.transform='translate('+dx+'px,'+dy+'px)';joyX=dx/lim;joyY=dy/lim}joy.onpointerdown=e=>{joyOn=true;joy.setPointerCapture(e.pointerId);setJoy(e)};joy.onpointermove=e=>{if(joyOn)setJoy(e)};function joyEnd(){joyOn=false;joyX=joyY=0;stick.style.transform='translate(0,0)'}joy.onpointerup=joyEnd;joy.onpointercancel=joyEnd;tick();frame()})();
</script></body></html>
