<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Lorencia — mapa original</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10150f;color:#f8e8c4;font-family:system-ui}#v{position:absolute;inset:0;overflow:hidden;touch-action:none;background:#172019}#map{position:absolute;left:50%;top:50%;width:max(100vw,1100px);height:auto;max-width:none;transform:translate(-50%,-50%) scale(1);user-select:none;pointer-events:none}canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.top{position:absolute;top:0;left:0;right:0;padding:12px 15px;background:linear-gradient(#10150fe8,transparent);display:flex;justify-content:space-between;text-shadow:0 2px 4px #000}.top b{letter-spacing:2px}.top small{display:block;font-size:9px}.panel{position:absolute;top:68px;left:10px;max-width:220px;padding:10px;background:#111b17e8;border:1px solid #c6a765;border-radius:7px}.panel select,.panel button{width:100%;padding:9px;background:#29352b;color:#fff0ce;border:1px solid #8e784d;border-radius:4px;margin-top:7px}.panel p,.panel small{font-size:10px;line-height:1.4}.joy{position:absolute;bottom:28px;left:16px;width:110px;height:110px;border-radius:50%;border:2px solid #e7ce8c99;background:#15201999;display:none;touch-action:none}.stick{position:absolute;left:31px;top:31px;width:44px;height:44px;border-radius:50%;background:#bba06aaa;border:2px solid #f5dfac}.actions{position:absolute;right:14px;bottom:30px;display:none;gap:8px}.actions button{width:54px;height:54px;border-radius:50%;background:#342c20e8;color:#ffebbd;border:2px solid #e3c783;font-size:18px}.foot{position:absolute;bottom:7px;width:100%;text-align:center;font-size:8px;letter-spacing:1px;text-shadow:0 1px 5px #000;pointer-events:none}@media(max-width:650px){.joy,.actions{display:flex}.panel{top:66px;max-width:185px;padding:8px}.panel p,.panel small{font-size:9px}.top{padding:9px}.top b{font-size:12px}.foot{bottom:150px}}</style></head><body><div id="v"><img id="map" src="lorencia-central.jpg" alt="Mapa original de Lorencia"><canvas id="fx"></canvas></div><header class="top"><div><b>✦ LORENCIA</b><small>MAPA ORIGINAL • EFEITOS ANIMADOS</small></div><span id="xy">138, 127</span></header><section class="panel"><b>EXPLORAR LORENCIA</b><select id="zone"><option value="lorencia-central.jpg">Praça central</option><option value="lorencia-rio.jpg">Rio e ponte</option></select><p>Mapa baseado nos recortes da arte original, com efeitos luminosos e movimento demonstrativo.</p><small>PC: WASD/setas • celular: joystick • arraste para câmera • zoom com roda/pinça</small><button id="reset">Centralizar câmera</button></section><div class="joy" id="joy"><div class="stick" id="stick"></div></div><div class="actions"><button id="atk">⚔</button><button id="skill">✦</button></div><div class="foot">LORENCIA • ARTE ORIGINAL • PROTÓTIPO JOGÁVEL</div><script>(()=>{const v=document.querySelector('#v'),img=document.querySelector('#map'),cv=document.querySelector('#fx'),c=cv.getContext('2d');let W,H,d=1,t=0,z=1,ox=0,oy=0,drag=false,lx=0,ly=0,jx=0,jy=0,attack=0,magic=0,pinch=0;const k={},p={x:0,y:0};function size(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;c.setTransform(d,0,0,d,0,0);layout()}function layout(){img.style.width=Math.max(W,1100)+'px';img.style.transform='translate(calc(-50% + '+ox+'px),calc(-50% + '+oy+'px)) scale('+z+')'}addEventListener('resize',size);size();img.onerror=()=>document.querySelector('.panel p').textContent='Imagem do mapa não carregou: confira os arquivos JPG na pasta public.';document.querySelector('#zone').onchange=e=>{img.src=e.target.value;ox=oy=0;z=1;layout()};document.querySelector('#reset').onclick=()=>{ox=oy=0;z=1;layout()};function fx(){t+=1/60;c.clearRect(0,0,W,H);for(let i=0;i<30;i++){let x=(i*137+Math.sin(t+i)*18+W)%W,y=(i*83+Math.cos(t*.8+i)*15+H)%H;c.fillStyle='rgba(255,218,126,'+(.15+.48*Math.abs(Math.sin(t*2+i)))+')';c.beginPath();c.arc(x,y,1+(i%3)*.4,0,7);c.fill()}for(let i=0;i<7;i++){let x=W*(.14+i*.12)+Math.sin(t*1.5+i)*5,y=H*(.25+(i%3)*.16)+Math.cos(t*2+i)*4,g=c.createRadialGradient(x,y,1,x,y,25);g.addColorStop(0,'rgba(255,220,120,.4)');g.addColorStop(1,'rgba(255,90,20,0)');c.fillStyle=g;c.beginPath();c.arc(x,y,25,0,7);c.fill()}let x=W*.5+p.x*2,y=H*.57+p.y*2;c.fillStyle='#0008';c.beginPath();c.ellipse(x,y+8,7,3,0,0,7);c.fill();c.fillStyle='#315b91';c.fillRect(x-4,y-12+Math.sin(t*10)*1.5,8,17);c.fillStyle='#e0b68b';c.fillRect(x-3,y-21,6,7);c.fillStyle='#3c2c21';c.fillRect(x-4,y-22,8,3);if(attack>0){c.strokeStyle='#fff0ce';c.lineWidth=3;c.beginPath();c.arc(x,y-8,18,-1.2,1.1);c.stroke();attack=Math.max(0,attack-.06)}if(magic>0){c.strokeStyle='rgba(100,220,255,'+magic+')';c.lineWidth=3;c.beginPath();c.arc(x,y-8,24,0,7);c.stroke();magic=Math.max(0,magic-.025)}document.querySelector('#xy').textContent=(138+Math.round(p.x))+', '+(127+Math.round(p.y));requestAnimationFrame(fx)}function move(a,b){let l=Math.hypot(a,b)||1;p.x+=a/l*.8;p.y+=b/l*.8}function tick(){let a=0,b=0;if(k.w||k.arrowup)b--;if(k.s||k.arrowdown)b++;if(k.a||k.arrowleft)a--;if(k.d||k.arrowright)a++;a+=jx;b+=jy;if(a||b)move(a,b);requestAnimationFrame(tick)}addEventListener('keydown',e=>{k[e.key.toLowerCase()]=true;if(e.key.startsWith('Arrow'))e.preventDefault()});addEventListener('keyup',e=>k[e.key.toLowerCase()]=false);v.addEventListener('pointerdown',e=>{if(e.target.closest('.panel,.joy,.actions'))return;drag=true;lx=e.clientX;ly=e.clientY;v.setPointerCapture(e.pointerId)});v.addEventListener('pointermove',e=>{if(drag){ox+=e.clientX-lx;oy+=e.clientY-ly;lx=e.clientX;ly=e.clientY;layout()}});v.addEventListener('pointerup',()=>drag=false);v.addEventListener('pointercancel',()=>drag=false);v.addEventListener('wheel',e=>{e.preventDefault();z=Math.max(.45,Math.min(2,z-e.deltaY*.001));layout()},{passive:false});v.addEventListener('touchmove',e=>{if(e.touches.length===2){let q=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pinch)z=Math.max(.45,Math.min(2,z+(q-pinch)*.003));pinch=q;layout()}},{passive:true});v.addEventListener('touchend',()=>pinch=0);const joy=document.querySelector('#joy'),stick=document.querySelector('#stick');let active=false;function sj(e){let r=joy.getBoundingClientRect(),a=e.clientX-r.left-r.width/2,b=e.clientY-r.top-r.height/2,m=r.width*.34,l=Math.hypot(a,b)||1;if(l>m){a=a/l*m;b=b/l*m}stick.style.transform='translate('+a+'px,'+b+'px)';jx=a/m;jy=b/m}joy.onpointerdown=e=>{active=true;joy.setPointerCapture(e.pointerId);sj(e)};joy.onpointermove=e=>{if(active)sj(e)};function ej(){active=false;jx=jy=0;stick.style.transform='translate(0,0)'}joy.onpointerup=ej;joy.onpointercancel=ej;document.querySelector('#atk').onclick=()=>attack=1;document.querySelector('#skill').onclick=()=>magic=1;tick();fx()})();</script></body></html>
