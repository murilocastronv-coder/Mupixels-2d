<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101714"><title>Lorencia 3D — mapa Meshy</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101714;color:#f5e7c5;font-family:system-ui,sans-serif;touch-action:none}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none}.title{position:absolute;top:14px;left:14px;padding:8px 12px;background:#101714c9;border:1px solid #b59a60;border-radius:8px;font-size:13px;letter-spacing:1px}.help{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:#101714c9;padding:8px 12px;border-radius:8px;font-size:11px;white-space:nowrap}.joy{display:none;position:absolute;left:18px;bottom:20px;width:126px;height:126px;border:2px solid #e7d195aa;border-radius:50%;background:#111b16a8;pointer-events:auto;touch-action:none}.nub{position:absolute;left:37px;top:37px;width:48px;height:48px;border:2px solid #ffedb4;border-radius:50%;background:#b9a06cbb}.buttons{display:none;position:absolute;right:16px;bottom:25px;gap:9px;pointer-events:auto}.buttons button,.topbtn{width:52px;height:52px;border:1px solid #e7d195;border-radius:50%;background:#20251fe8;color:#ffedc4;font-size:20px;pointer-events:auto}.topbtn{position:absolute;right:14px;top:70px;border-radius:9px;width:auto;height:auto;padding:10px;font-size:12px}.msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(90vw,400px);padding:18px;background:#101714ed;border:1px solid #b59a60;border-radius:10px;text-align:center;font-size:13px;line-height:1.5;pointer-events:auto}.msg button{margin-top:12px;background:#2b392d;color:#fff0ca;border:1px solid #b59a60;border-radius:6px;padding:10px 14px}@media(max-width:700px){.joy,.buttons{display:flex}.help{top:auto;bottom:158px;font-size:9px}.title{font-size:11px}.topbtn{top:62px}}
</style></head><body>
<div id="hud"><div class="title">✦ LORENCIA · MAPA 3D</div><div class="help">WASD/setas ou joystick · arraste para girar · roda/pinça para zoom</div><button class="topbtn" id="reset">Centralizar câmera</button><div class="joy" id="joy"><div class="nub" id="nub"></div></div><div class="buttons"><button id="attack">⚔</button><button id="skill">✦</button></div><div class="msg" id="msg">Carregando o mapa 3D…</div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
(()=>{'use strict';const msg=document.querySelector('#msg');function show(s,btn){msg.innerHTML=s+(btn?'<br><button onclick="location.reload()">Tentar novamente</button>':'');msg.style.display='block'}if(!window.THREE){show('Não foi possível carregar o motor 3D. Verifique a conexão e recarregue.',true);return}const T=THREE,scene=new T.Scene();scene.background=new T.Color(0x9eafa9);scene.fog=new T.Fog(0x9eafa9,100,500);const camera=new T.PerspectiveCamera(48,innerWidth/innerHeight,.1,2000);const renderer=new T.WebGLRenderer({antialias:innerWidth>700,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.6));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;document.body.prepend(renderer.domElement);scene.add(new T.HemisphereLight(0xdcecff,0x39432c,2.1));const sun=new T.DirectionalLight(0xffe0aa,3);sun.position.set(-30,60,20);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
let model=null,player=new T.Group(),yaw=.2,dist=22,height=12,mx=0,mz=0,keys={},drag=false,dx=0,dy=0,joyX=0,joyY=0;const ground=new T.Mesh(new T.PlaneGeometry(1000,1000),new T.MeshStandardMaterial({color:0x465b3e,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.15;ground.receiveShadow=true;scene.add(ground);const marker=new T.Mesh(new T.CylinderGeometry(.5,.5,.08,16),new T.MeshStandardMaterial({color:0x54bfe7,emissive:0x145a77}));marker.position.y=.05;player.add(marker);scene.add(player);
function load(){new T.GLTFLoader().load('./map.glb',g=>{model=g.scene;model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;if(o.material){o.material.side=T.DoubleSide}}});const box=new T.Box3().setFromObject(model),size=box.getSize(new T.Vector3()),center=box.getCenter(new T.Vector3());model.position.sub(center);model.position.y-=box.min.y;scene.add(model);const span=Math.max(size.x,size.y,size.z,10);dist=Math.max(12,span*.8);height=Math.max(7,span*.5);camera.far=Math.max(2000,span*5);camera.updateProjectionMatrix();sun.position.set(-span*.6,span*1.3,span*.5);sun.shadow.camera.left=-span;sun.shadow.camera.right=span;sun.shadow.camera.top=span;sun.shadow.camera.bottom=-span;msg.style.display='none';player.position.set(0,0,0);},undefined,e=>{console.error(e);show('O arquivo <b>map.glb</b> ainda não está no diretório público do site. Coloque o arquivo Meshy com esse nome na pasta <b>public/</b> do GitHub e o Render fará o deploy automático.',false)})}load();
renderer.domElement.addEventListener('pointerdown',e=>{if(e.target.closest?.('button,.joy,.buttons'))return;drag=true;dx=e.clientX;dy=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(drag){yaw-=(e.clientX-dx)*.006;height=Math.max(2,height+(e.clientY-dy)*.04);dx=e.clientX;dy=e.clientY}});renderer.domElement.addEventListener('pointerup',()=>drag=false);renderer.domElement.addEventListener('pointercancel',()=>drag=false);renderer.domElement.addEventListener('wheel',e=>{dist=Math.max(4,Math.min(500,dist+e.deltaY*.025));e.preventDefault()},{passive:false});addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const joy=document.querySelector('#joy'),nub=document.querySelector('#nub');let joyOn=false;function moveJoy(e){const r=joy.getBoundingClientRect();let x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,m=r.width*.32,l=Math.hypot(x,y)||1;if(l>m){x=x/l*m;y=y/l*m}joyX=x/m;joyY=y/m;nub.style.transform='translate('+x+'px,'+y+'px)'}joy.onpointerdown=e=>{joyOn=true;joy.setPointerCapture(e.pointerId);moveJoy(e)};joy.onpointermove=e=>{if(joyOn)moveJoy(e)};function stop(){joyOn=false;joyX=joyY=0;nub.style.transform='translate(0,0)'}joy.onpointerup=stop;joy.onpointercancel=stop;document.querySelector('#reset').onclick=()=>{yaw=.2;dist=model?Math.max(12,new T.Box3().setFromObject(model).getSize(new T.Vector3()).length()*.45):22;height=dist*.55};document.querySelector('#attack').onclick=()=>{marker.material.color.set(0xff6045);setTimeout(()=>marker.material.color.set(0x54bfe7),250)};document.querySelector('#skill').onclick=()=>{marker.material.emissive.set(0x45aaff);setTimeout(()=>marker.material.emissive.set(0x145a77),450)};
let last=0;function loop(t){requestAnimationFrame(loop);let dt=Math.min((t-last)/1000||0,.04);last=t;let x=0,z=0;if(keys.w||keys.arrowup)z-=1;if(keys.s||keys.arrowdown)z+=1;if(keys.a||keys.arrowleft)x-=1;if(keys.d||keys.arrowright)x+=1;x+=joyX;z+=joyY;let l=Math.hypot(x,z);if(l>.08){x/=Math.max(1,l);z/=Math.max(1,l);const ca=Math.cos(yaw),sa=Math.sin(yaw);player.position.x+=(x*ca+z*sa)*dt*6;player.position.z+=(-x*sa+z*ca)*dt*6;player.rotation.y=Math.atan2(x,z)}const target=player.position;camera.position.lerp(new T.Vector3(target.x+Math.sin(yaw)*dist,height,target.z+Math.cos(yaw)*dist),.08);camera.lookAt(target.x,Math.max(0,height*.08),target.z);renderer.render(scene,camera)}loop(0);function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.6));renderer.setSize(innerWidth,innerHeight)}addEventListener('resize',resize);
})();</script></body></html>
