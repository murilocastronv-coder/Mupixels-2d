<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Lorencia Pixel MMORPG</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#101713;color:#f6e7c0;font-family:system-ui}canvas{position:absolute;width:100%;height:100%;touch-action:none}.hud{position:absolute;top:0;left:0;right:0;padding:12px 16px;display:flex;justify-content:space-between;background:linear-gradient(#101713ed,transparent);pointer-events:none}.panel{position:absolute;top:75px;left:12px;width:200px;background:#111b17e8;border:1px solid #bca06666;border-radius:7px;padding:10px}.panel select,.panel button{width:100%;padding:8px;background:#29352b;color:#f6e7c0;border:1px solid #8e784d}.panel p{font-size:11px}.footer{position:absolute;bottom:8px;width:100%;text-align:center;font-size:8px;letter-spacing:1px}.mobile-controls,.actions{position:absolute;bottom:35px;display:none}.mobile-controls{left:15px;width:110px;height:110px;border:2px solid #e7ce8c66;border-radius:50%;background:#152019a8}.stick{position:absolute;left:30px;top:30px;width:45px;height:45px;border-radius:50%;background:#bba06a99;border:2px solid #f5dfac}.actions{right:12px;gap:8px}.actions button{border-radius:50%;width:55px;height:55px;background:#342c20d9;color:#ffebbd;border:2px solid #e3c783}@media(max-width:650px){.mobile-controls,.actions{display:flex}.panel{width:165px;top:67px}.panel p{font-size:9px}.hud{padding:9px;font-size:12px}} </style></head><body><canvas id="g"></canvas><header class="hud"><b>✦ LORENCIA<br><small>REINO DOS HERÓIS</small></b><span id="coords">138, 127</span></header><section class="panel"><label>EXPLORAR MAPA</label><select id="zone"><option value="town">Lorencia — Praça central</option><option value="south">Lorencia Sul — Rio e ponte</option></select><p id="desc">Praça medieval, fonte, lojas e guardas.</p><small>WASD/setas • toque no chão para andar</small><button id="reset">Centralizar câmera</button></section><div class="mobile-controls" id="joy"><div class="stick" id="stick"></div></div><div class="actions"><button id="attack">⚔</button><button id="skill">✦</button></div><div class="footer">MAPA PROCEDURAL ANIMADO • DEMO JOGÁVEL</div><script>
(()=>{const c=document.querySelector('#g'),x=c.getContext('2d');let W,H,d=1,t=0,zone='town',zoom=1,cx=0,cy=0,drag=false,lx=0,ly=0,joyX=0,joyY=0,joyOn=false,atk=0,magic=0;const keys={},p={x:0,y:2,walk:0},npcs=[];for(let i=0;i<20;i++)npcs.push({x:Math.sin(i*13.7)*10,y:Math.cos(i*8.3)*8,col:['#385c87','#57564c','#8c4933','#555f78'][i%4],phase:i*.8});function size(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}addEventListener('resize',size);size();const iso=(a,b,z=0)=>[W/2+cx+(a-b)*18*zoom,H*.51+cy+(a+b)*9*zoom-z*17*zoom];function poly(a,col,edge){x.beginPath();a.forEach((q,i)=>i?x.lineTo(...q):x.moveTo(...q));x.closePath();x.fillStyle=col;x.fill();if(edge){x.strokeStyle=edge;x.lineWidth=.8*zoom;x.stroke()}}function dia(a,b,w,h,col,edge){poly([[a,b-h],[a+w,b],[a,b+h],[a-w,b]],col,edge)}function tile(a,b,col){let q=iso(a,b);dia(q[0],q[1],18*zoom,9*zoom,col,'#3e5239');if((a*3+b*5)%7===0){x.fillStyle='#c6b17c77';x.fillRect(q[0]-4*zoom,q[1]-zoom,3*zoom,zoom)}}function path(a,b){let q=iso(a,b);dia(q[0],q[1],17.8*zoom,8.7*zoom,((a+b)%3===0)?'#b09a70':'#92805f','#514b39');for(let i=0;i<3;i++){x.fillStyle=['#c5b184','#71664f','#a8936c'][(a*2+b+i+40)%3];x.fillRect(q[0]+Math.sin(a*9+i)*9*zoom,q[1]+Math.cos(b*4+i)*4*zoom,2.7*zoom,1.3*zoom)}}function block(a,b,w,h,z,front,side,top){let q=iso(a,b),A=w*zoom,B=h*zoom,Z=z*zoom;poly([[q[0],q[1]-Z],[q[0]+A,q[1]-Z+B*.5],[q[0]+A,q[1]+B*.5],[q[0],q[1]]],front,'#30291f');poly([[q[0],q[1]-Z],[q[0]-A,q[1]-Z+B*.5],[q[0]-A,q[1]+B*.5],[q[0],q[1]]],side,'#30291f');poly([[q[0],q[1]-Z],[q[0]+A,q[1]-Z+B*.5],[q[0],q[1]-Z+B],[q[0]-A,q[1]-Z+B*.5]],top,'#463c2e')}function house(a,b,i){block(a,b,19,19,25,'#8a704e','#574735','#b7a07a');let q=iso(a,b);poly([[q[0]-22*zoom,q[1]-25*zoom],[q[0],q[1]-45*zoom],[q[0]+22*zoom,q[1]-25*zoom],[q[0],q[1]-7*zoom]],i%2?'#57302a':'#493a31','#2d211c');for(let k=-2;k<=2;k++){x.strokeStyle=i%2?'#a9563e':'#81776a';x.lineWidth=1.2*zoom;x.beginPath();x.moveTo(q[0]+k*7*zoom,q[1]-27*zoom);x.lineTo(q[0]+k*3.5*zoom,q[1]-42*zoom);x.stroke()}x.fillStyle='#292019';x.fillRect(q[0]-4*zoom,q[1]-18*zoom,8*zoom,18*zoom);x.fillStyle='#efb95e';x.fillRect(q[0]+8*zoom,q[1]-18*zoom,5*zoom,6*zoom)}function tree(a,b,s=1){block(a,b,3,3,11*s,'#624329','#442f20','#91653b');let q=iso(a,b,14*s);for(let k=0;k<3;k++){let yy=q[1]+k*9*s*zoom;poly([[q[0],yy-18*s*zoom],[q[0]+13*s*zoom,yy],[q[0],yy+10*s*zoom],[q[0]-13*s*zoom,yy]],['#285a36','#387244','#4d8545'][k],'#24452c');poly([[q[0],yy-18*s*zoom],[q[0]+13*s*zoom,yy],[q[0],yy+10*s*zoom]],'#8bb05c33')}}function torch(a,b){let q=iso(a,b,9),f=Math.sin(t*9+a)*2+Math.cos(t*13+b);x.fillStyle='#4b3725';x.fillRect(q[0]-2*zoom,q[1]-zoom,4*zoom,10*zoom);let g=x.createRadialGradient(q[0],q[1]-7*zoom,1,q[0],q[1]-7*zoom,18*zoom);g.addColorStop(0,'#fff3a8aa');g.addColorStop(.3,'#ff982b88');g.addColorStop(1,'#ff600000');x.fillStyle=g;x.beginPath();x.arc(q[0],q[1]-7*zoom,18*zoom,0,7);x.fill();poly([[q[0],q[1]-(8+f)*zoom],[q[0]+4*zoom,q[1]-4*zoom],[q[0],q[1]-zoom],[q[0]-3*zoom,q[1]-4*zoom]],'#ff9228')}function water(a,b){let q=iso(a,b);dia(q[0],q[1],18*zoom,9*zoom,'#126b76','#255a58');for(let i=0;i<3;i++){let f=(t*15+i*13+a*2+b*5)%30;x.strokeStyle='rgba(135,239,224,.55)';x.beginPath();x.moveTo(q[0]-10*zoom+f*.35,q[1]-2*zoom);x.lineTo(q[0]-4*zoom+f*.35,q[1]-4*zoom);x.stroke()}}function fountain(a,b){let q=iso(a,b);dia(q[0],q[1],26*zoom,13*zoom,'#827d65','#403e32');dia(q[0],q[1]-4*zoom,20*zoom,10*zoom,'#27878a','#b8b9a0');block(a,b,4,4,20,'#9e9274','#6b6350','#c4b99a');let z=iso(a,b,25+Math.sin(t*4)*2);x.fillStyle='#d3f8ff';x.beginPath();x.arc(z[0],z[1],2.5*zoom,0,7);x.fill();for(let i=0;i<7;i++){let ang=t*2+i*Math.PI*2/7;x.fillStyle='#9ce9ef';x.fillRect(q[0]+Math.cos(ang)*14*zoom,q[1]-14*zoom+Math.sin(ang)*5*zoom,2*zoom,3*zoom)}}function npc(o){let bob=Math.sin(t*3+o.phase)*1.4*zoom,q=iso(o.x,o.y);x.fillStyle='#0005';x.beginPath();x.ellipse(q[0],q[1],6*zoom,2.8*zoom,0,0,7);x.fill();block(o.x,o.y,3.8,3,11,o.col,'#33342d',o.col);let h=iso(o.x,o.y,13);x.fillStyle='#d5a77a';x.fillRect(h[0]-3.2*zoom,h[1]-4*zoom+bob,6.4*zoom,7*zoom);x.fillStyle='#302a21';x.fillRect(h[0]-4*zoom,h[1]-5*zoom+bob,8*zoom,3*zoom);if(o.phase%2<1){x.strokeStyle='#c6c9bd';x.lineWidth=2*zoom;x.beginPath();x.moveTo(q[0]+5*zoom,q[1]-8*zoom);x.lineTo(q[0]+10*zoom,q[1]-17*zoom);x.stroke()}}function scene(){for(let b=-22;b<23;b++)for(let a=-25;a<26;a++){if(zone==='south'&&a+b< -10&&a+b> -31){water(a,b);continue}tile(a,b,((a*13+b*5)%9===0)?'#667d4a':((a+b)%4===0?'#748754':'#657b4a'))}if(zone==='town'){for(let b=-14;b<=14;b++)for(let a=-18;a<=18;a++)if(Math.abs(a)<3||Math.abs(b)<3)path(a,b);for(let i=0;i<24;i++){let a=(i%6-3)*5.2+(i%2),b=(Math.floor(i/6)-2)*6.2;if(Math.abs(a)<5&&Math.abs(b)<5)continue;house(a,b,i)}fountain(0,0);[[-5,-4],[5,4],[-2,-7],[3,-2],[-11,5],[11,-1],[0,8]].forEach(v=>torch(...v));[[-13,-8],[13,7],[-15,8],[15,-8],[-8,12],[9,12]].forEach(v=>tree(v[0],v[1],1.1));npcs.forEach(npc)}else{for(let a=-20;a<=20;a++)for(let b=-20;b<=20;b++)if(Math.abs(a-b)<2)path(a,b);[[-15,-8],[-12,-3],[-9,8],[14,-8],[12,2],[8,13],[-16,12],[18,8]].forEach(v=>tree(v[0],v[1],1.2));[[-8,-7],[9,-8],[13,7],[-12,5]].forEach((v,i)=>house(v[0],v[1],i));for(let i=0;i<8;i++){let q=iso(-3+i*.85,2-i*.85);dia(q[0],q[1],9*zoom,4.5*zoom,'#79583b','#382b22')}[[-5,0],[2,-3],[6,4],[-8,7],[9,1]].forEach(v=>torch(...v));npcs.slice(0,12).forEach(npc)}}function hero(){let q=iso(p.x,p.y),bob=Math.sin(p.walk*10)*1.7*zoom;x.fillStyle='#0006';x.beginPath();x.ellipse(q[0],q[1]+2*zoom,7*zoom,3*zoom,0,0,7);x.fill();block(p.x,p.y,4.2,3.4,12,'#315b91','#203e68','#4b7eb1');let h=iso(p.x,p.y,14);x.fillStyle='#e0b68b';x.fillRect(h[0]-3.5*zoom,h[1]-4*zoom+bob,7*zoom,7*zoom);x.fillStyle='#3c2c21';x.fillRect(h[0]-4*zoom,h[1]-5*zoom+bob,8*zoom,3*zoom);x.fillStyle='#b9c5c9';x.fillRect(q[0]+4*zoom,q[1]-9*zoom,2*zoom,8*zoom);if(atk>0){x.strokeStyle='#eaf5ff';x.lineWidth=3*zoom;x.beginPath();x.arc(q[0],q[1]-8*zoom,(18-atk*7)*zoom,-1.2,1.2);x.stroke();atk-=.07}if(magic>0){x.strokeStyle='rgba(115,217,255,'+magic+')';x.lineWidth=3*zoom;x.beginPath();x.arc(q[0],q[1]-8*zoom,23*zoom,0,7);x.stroke();magic-=.025}}function draw(){t+=1/60;x.clearRect(0,0,W,H);x.fillStyle=zone==='town'?'#263b2a':'#123d40';x.fillRect(0,0,W,H);scene();hero();for(let i=0;i<12;i++){let a=(i*113+Math.sin(t+i)*15+W*.1)%W,b=(i*59+Math.cos(t*1.3+i)*13+H*.2)%H;x.fillStyle='rgba(255,218,126,'+(.25+.5*Math.abs(Math.sin(t*2+i))+')';x.fillRect(a,b,2*zoom,2*zoom)}let g=x.createRadialGradient(W*.5,H*.48,Math.min(W,H)*.1,W*.5,H*.5,Math.max(W,H)*.75);g.addColorStop(0,'#0000');g.addColorStop(1,'#080c0877');x.fillStyle=g;x.fillRect(0,0,W,H);document.getElementById('coords').textContent=Math.round(p.x+138)+', '+Math.round(p.y+127);requestAnimationFrame(draw)}function move(a,b){let l=Math.hypot(a,b)||1;p.x=Math.max(-20,Math.min(20,p.x+a/l*.11));p.y=Math.max(-18,Math.min(18,p.y+b/l*.11));if(a||b)p.walk+=.12}function tick(){let a=0,b=0;if(keys.w||keys.arrowup)b--;if(keys.s||keys.arrowdown)b++;if(keys.a||keys.arrowleft)a--;if(keys.d||keys.arrowright)a++;a+=joyX;b+=joyY;if(a||b)move(a,b);requestAnimationFrame(tick)}addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);c.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(drag){cx+=e.clientX-lx;cy+=e.clientY-ly;lx=e.clientX;ly=e.clientY}});c.addEventListener('pointerup',()=>drag=false);c.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.55,Math.min(1.45,zoom-e.deltaY*.001))},{passive:false});document.getElementById('zone').onchange=e=>{zone=e.target.value;document.getElementById('desc').textContent=zone==='town'?'Praça medieval, fonte, lojas e guardas.':'Arredores verdes, rio brilhante e ponte de madeira.';p.x=p.y=0;cx=cy=0};document.getElementById('reset').onclick=()=>{cx=cy=0;zoom=1};document.getElementById('attack').onclick=()=>atk=1;document.getElementById('skill').onclick=()=>magic=1;const joy=document.getElementById('joy'),stick=document.getElementById('stick');function setJoy(e){let r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),lim=r.width*.34,l=Math.hypot(dx,dy)||1;if(l>lim){dx=dx/l*lim;dy=dy/l*lim}stick.style.transform='translate('+dx+'px,'+dy+'px)';joyX=dx/lim;joyY=dy/lim}joy.onpointerdown=e=>{joyOn=true;joy.setPointerCapture(e.pointerId);setJoy(e)};joy.onpointermove=e=>{if(joyOn)setJoy(e)};function end(){joyOn=false;joyX=joyY=0;stick.style.transform='translate(0,0)'}joy.onpointerup=end;joy.onpointercancel=end;tick();draw()})();
</script></body></html>
